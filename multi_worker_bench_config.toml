# Multi-Worker Benchmark Configuration
# Tests linear scaling with 2-4 workers

host = "127.0.0.1"
port = 8130
num_workers = 2  # Will be overridden by benchmark script
flush_interval = 2.0
log_level = "WARNING"  # Reduce log noise during benchmark
active_backends = ["logger"]
max_series = 100000
timer_histogram_config = [1, 3600000, 3]
socket_buffer_size = 16777216  # 16MB

obs_host = "127.0.0.1"
obs_port = 8131

[backend_configs.logger]
level = "WARNING"
mode = "ndjson"
sample_percent = 0.0
destination = "stdout"
